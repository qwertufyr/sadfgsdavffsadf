# Общие настройки Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Версия и группа мода
mod_version=1.0.0
maven_group=com.nullreach.prop
archives_base_name=nullreach-prop

# Проверь актуальные версии на https://fabricmc.net/develop если сборка не пойдёт —
# Fabric часто выпускает новые билды, а эти зафиксированы на момент выхода 1.21.11.
# Важно: 1.21.11 — последняя версия, для которой Fabric ещё выпускает Yarn-маппинги
# (дальше стандартом становятся маппинги Mojang), так что фиксируем именно её.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.18.1

# Fabric API
fabric_version=0.141.4+1.21.11
